worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream overleaf_ce {
        server 192.168.50.102:80;
    }

    upstream ollama_main {
        server 192.168.192.28:11434;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 100m;

        location = /overleaf-ai-assistant.js {
            alias /usr/share/nginx/html/overleaf-ai-assistant.js;
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        location /ollama/main/ {
            proxy_pass http://ollama_main/;
            proxy_http_version 1.1;

            proxy_set_header Host 192.168.192.28;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin "";
            proxy_set_header Referer "";

            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location / {
            proxy_pass http://overleaf_ce;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";

            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            proxy_buffering off;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'none';" always;

            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter '</body>' '<script src="/overleaf-ai-assistant.js"></script></body>';
        }
    }
}
