name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install nginx for deployment tests
        run: sudo apt-get update && sudo apt-get install -y nginx-light gettext-base
      - run: npm ci
      - run: npm run check
